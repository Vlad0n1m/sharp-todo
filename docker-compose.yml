version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5208:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - ./logs:/app/logs
    depends_on:
      - frontend

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    volumes:
      - ./front:/app
